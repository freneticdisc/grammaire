name: Publish Tessl Tiles

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skill:
          - skills/atlassian-browser-authentication
          - skills/atlassian-endpoint-resolver
          - skills/atlassian-rich-text-formatter
          - skills/atlassian-tasks
    env:
      TESSL_TOKEN: ${{ secrets.TESSL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if tile.json changed
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger — publishing."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          # New branch / first push: before is all zeros
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "First push to branch — publishing."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BEFORE" "$AFTER" -- "${{ matrix.skill }}/tile.json" | grep -q .; then
            echo "${{ matrix.skill }}/tile.json changed — publishing."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "${{ matrix.skill }}/tile.json unchanged — skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: tesslio/setup-tessl@v1
        if: steps.check.outputs.changed == 'true'

      - name: Lint
        if: steps.check.outputs.changed == 'true'
        run: tessl tile lint ${{ matrix.skill }}

      - name: Publish
        if: steps.check.outputs.changed == 'true'
        run: tessl tile publish ${{ matrix.skill }}
