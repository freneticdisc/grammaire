name: Publish Tessl Tiles

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skill:
          - skills/atlassian-browser-authentication
          - skills/atlassian-endpoint-resolver
          - skills/atlassian-rich-text-formatter
          - skills/atlassian-tasks
    steps:
      - uses: actions/checkout@v4
      - uses: tessl-io/publish-tile-action@v1
        with:
          tile-path: ${{ matrix.skill }}
          api-key: ${{ secrets.TESSL_TOKEN }}
          review-threshold: 70
